<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
<rect width="1280" height="760" fill="#fff"/>
<style>text{font-family:Arial,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#232323} .muted{fill:#666}</style>
<rect x="0" y="0" width="215" height="760" rx="0" fill="#fafafa" stroke="#b6b6b6" stroke-width="1"/>
<text x="20" y="30" font-size="18" font-weight="600">SPACE / 内容创作</text>
<text x="20" y="57" font-size="13" class="muted">目的：形成可交付内容</text>
<rect x="8" y="80" width="198" height="29" rx="0" fill="#ececec" stroke="none" stroke-width="1"/>
<text x="19" y="100" font-size="14" font-weight="600">业务目标与问题</text>
<text x="19" y="145" font-size="14" class="muted">工作流：尚未建立</text>
<text x="19" y="188" font-size="14">首版设计入口</text>
<text x="20" y="620" font-size="12" class="muted">无版本 / 无 Case / 无采用</text>
<rect x="215" y="0" width="1065" height="72" rx="0" fill="none" stroke="#b6b6b6" stroke-width="1"/>
<text x="239" y="31" font-size="21" font-weight="600">业务目标与问题</text>
<text x="239" y="57" font-size="13" class="muted">初建 Space · 尚无 workflow / Case</text>
<text x="1258" y="56" font-size="11" class="muted" text-anchor="end">合成线框示意 · 非实测</text>
<line x1="940" y1="72" x2="940" y2="760" stroke="#b6b6b6" stroke-width="1"/>
<text x="239" y="105" font-size="17" font-weight="600">Space 目的 → 形成首版方法的依据</text>
<text x="239" y="126" font-size="12" class="muted">尚无方法时显示清楚的起点，不伪造版本或运行状态</text>
<line x1="239" y1="139" x2="916" y2="139" stroke="#e5e5e5" stroke-width="1"/>
<rect x="260" y="204" width="270" height="83" rx="4" fill="#f0f0f0" stroke="#232323" stroke-width="1.5"/>
<text x="272" y="227" font-size="15" font-weight="600">1  业务目的</text>
<text x="272" y="249" font-size="12" class="muted">为具体受众形成可交付内容</text>
<rect x="600" y="204" width="270" height="83" rx="4" fill="#fff" stroke="#b6b6b6" stroke-width="1"/>
<text x="612" y="227" font-size="15" font-weight="600">2  受众与用途</text>
<text x="612" y="249" font-size="12" class="muted">读者 / 使用场景 / 交付方式</text>
<rect x="260" y="348" width="270" height="83" rx="4" fill="#fff" stroke="#b6b6b6" stroke-width="1"/>
<text x="272" y="371" font-size="15" font-weight="600">3  成功标准</text>
<text x="272" y="393" font-size="12" class="muted">内容质量、证据与可用性</text>
<rect x="600" y="348" width="270" height="83" rx="4" fill="#fff" stroke="#b6b6b6" stroke-width="1"/>
<text x="612" y="371" font-size="15" font-weight="600">4  未知与约束</text>
<text x="612" y="393" font-size="12" class="muted">材料不足、评价口径未定</text>
<line x1="530" y1="244" x2="600" y2="244" stroke="#232323" stroke-width="1.3"/>
<path d="M 593 240 L 600 244 L 593 248" fill="none" stroke="#232323" stroke-width="1.3"/>
<line x1="530" y1="390" x2="600" y2="390" stroke="#232323" stroke-width="1.3"/>
<path d="M 593 386 L 600 390 L 593 394" fill="none" stroke="#232323" stroke-width="1.3"/>
<rect x="260" y="512" width="610" height="75" rx="0" fill="#f8f8f8" stroke="#b6b6b6" stroke-width="1"/>
<text x="281" y="542" font-size="15" font-weight="600">5  首版入口：目的 + 材料 + 标准 → 具名方法草案</text>
<text x="281" y="567" font-size="12" class="muted">草案可保存并关联首委托；显式启动前再检查执行条件</text>
<text x="961" y="107" font-size="13" class="muted">选中对象 · 详情</text>
<text x="961" y="140" font-size="19" font-weight="600">① Space 目的</text>
<text x="961" y="165" font-size="12" class="muted">当前状态：无 workflow；无采用版本</text>
<line x1="960" y1="181" x2="1258" y2="181" stroke="#e5e5e5" stroke-width="1"/>
<text x="961" y="211" font-size="14" font-weight="600">具体目标</text>
<text x="961" y="235" font-size="13">让目标受众获得可信、可交付的内容。</text>
<text x="961" y="275" font-size="14" font-weight="600">设计输入</text>
<text x="961" y="299" font-size="13">用途、受众、已有材料、成功标准。</text>
<text x="961" y="339" font-size="14" font-weight="600">未知</text>
<text x="961" y="363" font-size="13">评分机制尚未定义；样例覆盖待补。</text>
<text x="961" y="403" font-size="14" font-weight="600">后续</text>
<text x="961" y="427" font-size="13">保存业务草案；首委托携带准确草案快照。</text>
</svg>
